spring.application.name=aclp

spring.datasource.url=jdbc:postgresql://localhost:5432/aclp_db
spring.datasource.username=${DB_USER:aclp_user}
# Valor de desenvolvimento local. Em prod/render vem de variavel de ambiente
# SEM default: o SecretsStartupValidator recusa subir com este valor fora de dev.
spring.datasource.password=${DB_PASSWORD:dev-local-only}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema muda so por migration; validate quebra o boot se entidade e banco divergirem.
spring.jpa.hibernate.ddl-auto=validate
# Bancos existentes (criados pelo ddl-auto ate a V8) entram com baseline na 9;
# banco vazio roda V9__schema_base + seguintes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=9
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.datasource.sql-script-encoding=UTF-8

aclp.redis.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000

aclp.time.format=HH:mm:ss
aclp.date.format=yyyy-MM-dd
aclp.datetime.format=yyyy-MM-dd'T'HH:mm:ss

spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-dates-with-zone-id=false
spring.jackson.time-zone=America/Sao_Paulo

server.port=8080

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
# A senha de aplicativo do Gmail que estava aqui em texto puro foi REMOVIDA.
# Ela precisa ser revogada no Google e reemitida — estando no codigo, deve ser
# considerada conhecida. Ver Checklist.md secao 7.
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.3,TLSv1.2
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.writetimeout=10000

aclp.email.enabled=true
aclp.email.remetente=TJBA - Sistema ACLP <juris.plenarioreal@gmail.com>
aclp.email.template.html=true
aclp.email.template.encoding=UTF-8
aclp.email.template.nome-sistema=ACLP - Sistema TJBA
aclp.email.template.instituicao=Tribunal de Justica da Bahia
aclp.email.template.departamento=Tecnologia da Informacao
aclp.email.template.email-suporte=suporte.aclp@tjba.jus.br

aclp.verificacao.codigo.validade-minutos=10
aclp.verificacao.codigo.max-tentativas=5
aclp.verificacao.rate-limit.max-por-ip-hora=10
aclp.verificacao.rate-limit.max-por-email-hora=3
aclp.verificacao.token.validade-minutos=30
aclp.verificacao.codigo.length=6
aclp.verificacao.limpeza.enabled=true
aclp.verificacao.limpeza.intervalo-horas=6

aclp.admin.bootstrap.enabled=false
aclp.admin.bootstrap.email=sistema.aclp@outlook.com
aclp.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:dev-local-only}
aclp.admin.bootstrap.nome=ACLP Tribunal
aclp.admin.security.token=TJBA_SECURE_2024

# Segredo de assinatura do JWT. O valor que estava aqui foi REMOVIDO: quem o
# conhece emite token valido de qualquer usuario, inclusive ADMIN.
# O default abaixo serve APENAS para desenvolvimento local e e recusado em
# producao pelo SecretsStartupValidator.
aclp.jwt.secret=${JWT_SECRET:dev-local-only-nao-use-em-producao-0123456789abcdef}
aclp.jwt.expiration-ms=3600000

aclp.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost
aclp.frontend.url=http://localhost

aclp.self-ping.enabled=false
aclp.self-ping.url=

viacep.api.url=https://viacep.com.br/ws

spring.profiles.active=dev
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.packages-to-scan=br.jus.tjba.aclp.controller
springdoc.paths-to-match=/api/**
springdoc.show-actuator=false
springdoc.swagger-ui.disable-swagger-default-url=true

logging.level.org.springframework.security=DEBUG
logging.level.br.jus.tjba.aclp=DEBUG
logging.level.br.jus.tjba.aclp.service.EmailService=INFO
logging.level.br.jus.tjba.aclp.service.EmailVerificationService=INFO
logging.level.br.jus.tjba.aclp.service.SetupService=WARN
logging.level.br.jus.tjba.aclp.config.SetupInterceptor=DEBUG

aclp.auth.cookie-secure=false

# Rate limiting das rotas de autenticacao (RateLimitFilter)
aclp.security.rate-limit.max-requests=10
aclp.security.rate-limit.window-seconds=60

# Retencao de login_attempts (expurgo diario as 03h)
aclp.security.login-attempts.retention-days=90

# Redis e so RedisTemplate (blacklist JWT); sem repositorios, sem scan
spring.data.redis.repositories.enabled=false
